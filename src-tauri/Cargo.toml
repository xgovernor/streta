[package]
name = "strata"
version = "0.1.0"
description = "Strata, a compact geospatial workspace"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = { version = "0.33", features = ["use-serde"] }
rstar = "0.13"
fast-mvt = "0.7"
geozero = { version = "0.15", features = ["with-mvt", "with-wkb", "with-geojson"] }
flatgeobuf = "6.0"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
moka = { version = "0.12", features = ["future"] }
sgp4 = "2.4"
bytemuck = { version = "1.21", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
h3o = { version = "0.11", features = ["geo", "serde"] }
contour = "0.13.1"
kiddo = "6.3.0"
parquet = { version = "60.1.0", default-features = false, features = ["flate2", "flate2-rust_backend", "snap"] }
dotenvy = "0.15"


[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
