# STRATA — Declarative Geospatial Dataset Manifest
# Master specification for built-in and out-of-core GIS datasets

[[dataset]]
id = "cctv_cameras"
name = "Traffic Cameras & Viewsheds"
description = "Global traffic cameras with 3D ground heights and field-of-view coverage cones"
category = "surveillance.traffic"
license = "Open data DOTs & municipal transport portals"
attribution = "Open data DOTs & municipal transport portals"
requires_api_key = false
min_zoom = 2
default_crs = "EPSG:4326"

[dataset.source]
type = "topojson"
path = "datasets/cctv-cameras.topo.json"
objects = ["cameras", "viewsheds"]

[dataset.style]
geometry_type = "mixed"
point_color = "#3b82f6"
stroke_color = "#60a5fa"
icon = "camera"
cluster_below_zoom = 6

