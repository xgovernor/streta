<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/strata.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b0f" />
    <meta
      name="description"
      content="Strata, a compact geospatial workspace built with OpenLayers, React, and Tauri."
    />
    <title>Strata · Geospatial Workspace</title>
    <script>
      // Cesium loads workers and static assets relative to this base URL.
      window.CESIUM_BASE_URL = "/cesium/";
    </script>
  </head>

  <body>
    <!-- macOS Boot Splash Screen (Paints immediately on Frame 0 before JS/Wasm loads) -->
    <div
      id="boot-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        transition: opacity 550ms cubic-bezier(0.16, 1, 0.3, 1), transform 550ms cubic-bezier(0.16, 1, 0.3, 1);
        transform: scale(1);
        will-change: opacity, transform;
      "
      aria-hidden="true"
    >
      <!-- Optical Centered Strata Emblem in Crisp White -->
      <div style="transform: translateY(-24px); display: flex; align-items: center; justify-content: center;">
        <svg width="68" height="68" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
          <circle cx="24" cy="24" r="13" stroke="#ffffff" stroke-width="2.2" />
          <path d="M24 4.5v39M4.5 24h39" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="24" cy="24" r="3.2" fill="#ffffff" />
        </svg>
      </div>

      <!-- macOS-Style Boot Progress Bar -->
      <div
        style="
          position: absolute;
          bottom: 14%;
          width: 154px;
          height: 4px;
          border-radius: 9999px;
          background: rgba(255, 255, 255, 0.18);
          overflow: hidden;
        "
      >
        <div
          id="boot-progress-fill"
          style="
            height: 100%;
            width: 100%;
            border-radius: 9999px;
            background: #ffffff;
            transform-origin: left center;
            transform: scaleX(0.08);
            will-change: transform;
          "
        ></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
